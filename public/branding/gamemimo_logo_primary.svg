<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="50%" stop-color="#FF8E53" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <linearGradient id="mimoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF6B8B" flood-opacity="0.3" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Mascot Bubble Icon -->
  <g transform="translate(20, 15)">
    <!-- Mascot Base Bubble -->
    <circle cx="45" cy="45" r="42" fill="url(#bgGrad)" filter="url(#dropShadow)" />
    <!-- Mascot Ears -->
    <circle cx="20" cy="18" r="14" fill="#FF6B8B" />
    <circle cx="20" cy="18" r="8" fill="#FFF0F5" />
    <circle cx="70" cy="18" r="14" fill="#FF8E53" />
    <circle cx="70" cy="18" r="8" fill="#FFF0F5" />
    <!-- Cute Eyes -->
    <ellipse cx="32" cy="40" rx="5" ry="7" fill="#2C3E50" />
    <circle cx="34" cy="37" r="2.5" fill="#FFFFFF" />
    <ellipse cx="58" cy="40" rx="5" ry="7" fill="#2C3E50" />
    <circle cx="60" cy="37" r="2.5" fill="#FFFFFF" />
    <!-- Cheerful Cheeks -->
    <circle cx="24" cy="48" r="6" fill="#FF3366" opacity="0.35" />
    <circle cx="66" cy="48" r="6" fill="#FF3366" opacity="0.35" />
    <!-- Kawaii Mouth -->
    <path d="M 40 48 Q 45 54 50 48" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
    <!-- Sparkle Star -->
    <path d="M 72 10 L 75 16 L 81 18 L 75 20 L 72 26 L 69 20 L 63 18 L 69 16 Z" fill="#FFD700" filter="url(#softGlow)" />
  </g>

  <!-- Typography: GAME MIMO -->
  <g transform="translate(130, 40)">
    <!-- GAME Text -->
    <text x="0" y="24" font-family="'Fredoka', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#2D3748" letter-spacing="1">
      Game
    </text>
    <!-- MIMO Text with Gradient -->
    <text x="105" y="24" font-family="'Fredoka', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="40" fill="url(#bgGrad)" filter="url(#softGlow)" letter-spacing="1.5">
      Mimo
    </text>
    <!-- Tagline Subtitle -->
    <text x="3" y="48" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#718096" letter-spacing="2">
      JOYFUL CASUAL GAMES &bull; SGGAME
    </text>
  </g>
</svg>
