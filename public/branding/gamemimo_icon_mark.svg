<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#FF5E7E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#iconBg)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring Highlight -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3" />

  <!-- Cute Cat / Bunny Mascot Character -->
  <g transform="translate(256, 260)">
    <!-- Ears -->
    <path d="M -120 -110 C -150 -200, -80 -230, -50 -150 Z" fill="#FFFFFF" />
    <path d="M -105 -120 C -130 -185, -85 -205, -60 -150 Z" fill="#FF85A1" />
    <path d="M 120 -110 C 150 -200, 80 -230, 50 -150 Z" fill="#FFFFFF" />
    <path d="M 105 -120 C 130 -185, 85 -205, 60 -150 Z" fill="#FF85A1" />

    <!-- Head Face -->
    <ellipse cx="0" cy="0" rx="160" ry="135" fill="#FFFFFF" />

    <!-- Kawaii Anime Eyes -->
    <ellipse cx="-60" cy="-10" rx="20" ry="28" fill="#2B2D42" />
    <circle cx="-52" cy="-22" r="10" fill="#FFFFFF" />
    <circle cx="-68" cy="4" r="5" fill="#FFFFFF" />

    <ellipse cx="60" cy="-10" rx="20" ry="28" fill="#2B2D42" />
    <circle cx="68" cy="-22" r="10" fill="#FFFFFF" />
    <circle cx="52" cy="4" r="5" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="-100" cy="25" rx="22" ry="14" fill="#FF85A1" opacity="0.6" />
    <ellipse cx="100" cy="25" rx="22" ry="14" fill="#FF85A1" opacity="0.6" />

    <!-- Cute Nose & Smile -->
    <ellipse cx="0" cy="15" rx="7" ry="5" fill="#FF6584" />
    <path d="M -18 28 Q 0 45 18 28" fill="none" stroke="#2B2D42" stroke-width="8" stroke-linecap="round" />

    <!-- Little Game Controller Badge -->
    <g transform="translate(85, 60) rotate(-15)">
      <rect x="-35" y="-20" width="70" height="40" rx="12" fill="#06D6A0" stroke="#FFFFFF" stroke-width="4" />
      <!-- D-pad -->
      <path d="M -20 -8 L -14 -8 L -14 -14 L -8 -14 L -8 -8 L -2 -8 L -2 -2 L -8 -2 L -8 4 L -14 4 L -14 -2 L -20 -2 Z" fill="#FFFFFF" />
      <!-- Buttons -->
      <circle cx="16" cy="-5" r="4" fill="#FFD166" />
      <circle cx="8" cy="3" r="4" fill="#EF476F" />
    </g>
  </g>

  <!-- Sparkles -->
  <path d="M 90 90 L 96 104 L 110 110 L 96 116 L 90 130 L 84 116 L 70 110 L 84 104 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 410 110 L 415 120 L 425 125 L 415 130 L 410 140 L 405 130 L 395 125 L 405 120 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
